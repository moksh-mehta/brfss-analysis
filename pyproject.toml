[project]
name = "brfss-mrp"
version = "0.1.0"
description = "Multilevel regression and poststratification of state-level diabetes prevalence from CDC BRFSS, in NumPyro"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
